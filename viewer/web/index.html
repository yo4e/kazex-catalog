<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>KAZEX — カタログ確認</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">本文へ</a>
  <div id="app"><p class="loading">カタログを読み込んでいます…</p></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="request-dialog" aria-labelledby="request-title">
    <h2 id="request-title">依頼文</h2>
    <p>コピーして、いつもの会話に貼り付けてください。</p>
    <textarea id="request-text" readonly aria-label="依頼文"></textarea>
    <div class="actions"><button id="dialog-copy" class="primary">コピー</button><button id="dialog-close">閉じる</button></div>
  </dialog>
</body>
</html>
