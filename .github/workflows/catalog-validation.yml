name: Catalog validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Test catalog, viewer and public export
        run: python -m unittest discover -s tests

      - name: Smoke test readiness checks
        run: |
          python scripts/check_readiness.py release unseen-dragon > /tmp/release-readiness.txt
          python scripts/check_readiness.py artist mri-music-resonance-imaging > /tmp/artist-readiness.txt
          grep -q "CAPTURE" /tmp/release-readiness.txt
          grep -q "TOO LOST PRIORITY PITCH" /tmp/release-readiness.txt
          grep -q "SPOTIFY FOR ARTISTS CLAIM / PROFILE" /tmp/artist-readiness.txt

      - name: Smoke test browser task packets
        run: |
          python scripts/render_browser_task.py priority-pitch unseen-dragon > /tmp/priority-pitch.txt
          python scripts/render_browser_task.py spotify-profile mri-music-resonance-imaging > /tmp/spotify-profile.txt
          grep -q "Browser Task Packet — Too Lost Priority Pitch" /tmp/priority-pitch.txt
          grep -q "READY FOR FORM ENTRY" /tmp/priority-pitch.txt
          grep -q "Browser Task Packet — Spotify for Artists" /tmp/spotify-profile.txt
          grep -q "UPDATE EXISTING PROFILE" /tmp/spotify-profile.txt
          grep -q "READY FOR PROFILE UPDATE" /tmp/spotify-profile.txt
