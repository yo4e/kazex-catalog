name: Publish catalog Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate catalog and public boundary
        run: |
          python scripts/validate_catalog.py
          python -m unittest discover -s tests
      - name: Build public catalog only
        run: python scripts/build_public_viewer.py --output /tmp/kazex-pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/kazex-pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public catalog
        id: deployment
        uses: actions/deploy-pages@v4
