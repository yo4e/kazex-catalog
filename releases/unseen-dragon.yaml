notes_public: >
  Priority Pitch用Release Summaryは2026-08-12作成。画像／EPK等は要確認。
  Spotify Canvas等のビジュアル施策を予定しているためPriority PitchのMarketing Elementsに
  visual content strategyを登録。デビュー作品のため過去の受賞・リリース実績はなし。
  SunoプレイリストURLと制作チャットで確定した15曲の曲名・共通creative promptを登録。
  2026-10-26にSpotify／Apple Musicの公開作品ページで作品名・アーティスト・
  リリース日・15曲・KazeX Recordsを照合した調査結果から、statusをreleasedへ更新。
  本人指定のsmartlink、アルバム配信リンク、全15曲のSpotify／YouTubeリンクを反映。
  同日のToo Lost作品詳細で曲名ごとに直接照合したUPC/EAN・catalog number・15曲のISRCを登録。
  配信サービス上のアーティスト表記は「MRI: Music Resonance Imaging」だが、catalogの名称は維持。
  website.publishとPriority Pitchのstatusは変更しない。
