description:
  short: >
    実際のMRI検査の聴覚体験を出発点に、機械音、金属音、静寂、共鳴を音楽として再構築するアルバム。
  long: null

promotion:
  priority_pitch:
    status: draft
    selected_track: "MRI: Music Resonance Imaging"
    release_summary: >
      “MRI: Music Resonance Imaging” opens Unseen Dragon: industrial techno inspired by the real experience of being inside an MRI scanner. Through the headset, classical piano plays; the machine’s metallic hammering swallows it, and in the abrupt silence the piano returns. Metallic percussion, distorted kicks, prepared piano and glitch edits recreate that gap — the cold intensity of the scan, and the quiet after it. Resonance turned into music, to reveal what cannot be seen.
    release_summary_ja: >-
      『Unseen Dragon』の幕開けを飾る「MRI: Music Resonance Imaging」は、MRIスキャナーの中に入った実際の体験にインスパイアされたインダストリアル・テクノ。ヘッドセットからはクラシックのピアノが流れ、機械の金属的な打撃音に呑み込まれ、ふいに訪れる静寂の中でピアノが戻ってくる。金属的なパーカッション、歪んだキック、プリペアド・ピアノ、グリッチ編集がそのギャップを再現する――スキャンの冷たい緊張感と、その後の静けさを。見えないものを明らかにするために、共鳴を音楽へ。
    spotify_artist: null
    marketing_elements:
      - visual content strategy
    past_awards_milestones: >
      This is the debut release from MRI: Music Resonance Imaging. The project has no prior awards, chart milestones, or previous releases to report.
    upcoming_tour_dates: null
