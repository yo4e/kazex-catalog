notes_public: >
  Priority Pitch用Release Summaryは2026-08-12作成。画像／EPK等は要確認。
  Spotify Canvas等のビジュアル施策を予定しているためPriority PitchのMarketing Elementsに
  visual content strategyを登録。デビュー作品のため過去の受賞・リリース実績はなし。
  SunoプレイリストURLと制作チャットで確定した15曲の曲名・共通creative promptを登録。
  2026-10-26にSpotify／Apple Musicの公開作品ページで作品名・アーティスト・
  リリース日・15曲・KazeX Recordsを照合した調査結果から、statusをreleasedへ更新。
  本人指定のsmartlink、アルバム配信リンク、全15曲のSpotify／YouTubeリンクを反映。
  同日のToo Lost作品詳細で曲名ごとに直接照合したUPC/EAN・catalog number・15曲のISRCを登録。
  2026-11-09本人確認に基づき、1曲目（ISRC QZPEW0826527）のtitleとピッチ内の名称表記を正式表記に統一。
  正式表記の文字・空白のルールはartists/mri-music-resonance-imaging.yamlのnotes_publicを参照。
  配信先に残る曲名「MRI_Music Resonance Imaging」は外部照合用の原表記としてここに記録する。
  配信サービス側の登録修正は行っていない。ISRCと配信URLは維持する。
  website.publishとPriority Pitchのstatusは変更しない。
  2026-10-30本人確認: 現存15曲の作曲者をGlamorous Fanとして登録。
  Too Lost原語UIのWriters表記と本人指定を照合し、役割は本人回答を根拠とする。
  全曲Instrumentalの既存確認、曲名・ISRC・歌詞状態・公開設定・pitchは保持。
  2026-11-06本人確認: Release Summaryを改訂。MRIの実音をサンプリングしたという意味ではなく、
  ヘッドセットのクラシックピアノ、機械の金属音、急な静寂という検査中の聴覚体験から
  インスパイアされた作品であることを明確化。Priority Pitchはdraftを維持。
