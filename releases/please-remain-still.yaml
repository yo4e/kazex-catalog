description:
  short: 'The second album from MRI: Music Resonance Imaging explores the movement that persists within
    a body instructed to remain still.'
  long: |-
    Please Remain Still is the second album from MRI: Music Resonance Imaging, tracing the restless inner life of a body asked not to move. Following Unseen Dragon, it turns from the machine's search beneath the skin toward the experience of waiting inside it: the voice beyond the glass, the intervals between pulses, and the small movements that resist control.

    Across fifteen tracks, the language of the scan becomes a sequence of rooms, signals, memories, and interruptions. Mechanical repetition, metallic resonance, silence, and clinical tension frame a question that runs through the album: what keeps moving when the body must stay still?

    Beginning with the instruction “Please Remain Still” and ending with “You May Move Now,” the album follows the space between restraint and release, where a machine measures the body while thought and sensation continue beyond its command.
promotion:
  priority_pitch:
    status: draft
    selected_track: Please Remain Still
    release_summary: >-
      The second album from MRI: Music Resonance Imaging was born in a hospital ward. Ordered to rest — a body kept perfectly still in bed, and in the scanner — while inside, the mind kept dancing to the machine's rhythm. Industrial techno at 128 BPM: metallic percussion, distorted kicks, prepared piano and gated silence, with classical piano surfacing like music through a patient's headset. On "Please Remain Still," the instruction becomes the groove: the body obeys; the heart doesn't.
