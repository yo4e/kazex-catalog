description:
  short: >
    幽霊、速度、残像、落下、信号、金属、不在を軸に、
    「消えたあとも続く運動」を描くコズミック・ジャズのアルバム。
  long: >
    存在そのものは消えても、速度、後流、残像、信号、ベクトルだけがなお進み続ける。
    Ghost Velocityは、触れられないものが運動の痕跡だけを残して飛び続ける感覚を核に、
    落下する金属、散乱する信号、見えない炎への着陸までを11曲で描く。

promotion:
  priority_pitch:
    status: draft
    selected_track: Ghost Velocity
    release_summary: >
      “Ghost Velocity” is a fast-paced cosmic jazz piece where vibraphone and piano trace luminous afterimages through space. Driven by upright bass and light drums, it moves with the force of something half-gone but still accelerating. Delicate chord accents suggest gravity, while the abstract arrangement turns speed, absence, and motion into a vivid sonic apparition.
