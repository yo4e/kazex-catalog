notes_public: >
  2026-08-18時点でToo Lost登録情報から、リリース日、ジャンル、レーベル、
  カタログ番号、C/Pライン、歌詞なし、11曲分のISRCを反映。
  Too Lost画面上では「配信済み11トラック」と表示されていたが、
  当時はリリース日2026-08-24より前のため、catalog statusをupcomingとしていた。
  Suno公開プレイリストを制作元として登録。各曲の公開creative promptは
  プレイリストから追補可能。
  初期設定資料からアルバム全体のコンセプト説明とPriority Pitch用Release Summaryを反映。
  トラックごとの日本語意訳・解説は docs/releases/ghost-velocity-initial-concept.md に保存。
  2025年の過去リリース4作をPriority Pitch用Past Awards / Milestonesに反映。
  Spotify Artist URLをPriority Pitch用情報として登録。
  Spotify Canvas制作予定をMarketing Elementsのvisual content strategyとして登録。
  2026-08-18にルートInboxへ追加された画像をGhost Velocityの正式ジャケットとして分類登録。
  2026-08-18にToo Lost Priority PitchへGhost Velocityを実申請。statusをsubmittedへ更新。
  2026-10-26にSpotify／Apple Musicの公開作品ページで作品名・アーティスト・
  リリース日・11曲・KazeX Recordsを照合した調査結果から、statusをreleasedへ更新。
  アルバムのSpotify／Apple Musicリンクと全11曲のSpotifyリンクを反映。
  Apple Musicアルバムリンクは確認済みのLUストアURLを保持。YouTubeは未確認。
  既存識別子、website.publish、Priority Pitchのstatusは維持。
  2026-10-27にToo Lost登録smartlinkと公開ページの作品名を照合して追補。
  公開Apple Music日本ストアの同一アルバムで曲順・曲名を照合し、11曲のApple Musicリンクを追補。
  公開根拠: https://music.apple.com/jp/album/ghost-velocity/6800608556
  2026-10-28補完: Apple MusicとSpotifyの公開アルバムデータで曲順・曲名・
  登録済みの各曲IDを全11曲照合し、両サービスのdurationミリ秒値が全曲一致することを確認。
  duration_secondsはApple MusicのMusicRecording構造化データにある秒単位表記を採用。
  smartlinkの丸め表示はBlueburn Transitが3:16、Nocturne for Falling Metalが2:12、
  Scatter Signal Paradeが3:53、Airspeed of the Absentが3:04、Landing on Invisible Fireが5:10で、
  採用値より各1秒長い。音源原本の厳密な長さとは区別する。
  全11曲のcredits.songwritersはApple Music公開アルバムデータのcomposer欄にある
  Glamorous Fanを原表記で記録。作曲者としての登録情報であり、作詞・演奏・制作担当は推定しない。
  GlamorousFan等の他表記との名寄せは行わず、既存C/Pラインは保持。
  Apple Music作品URLは同一album IDを確認済みの日本ストアURLへ更新。
  配信日・UPC・ISRC・Instrumental確認・画像候補・website.publish・pitchは変更していない。
  公開根拠: https://open.spotify.com/album/6mbDVw5ILYJQn2h4HltiVv
  公開根拠: https://too.fm/ghostvelocity
  2026-10-29: 上記の全11曲は役割がcomposerとして確認できるため、登録名を変更せず
