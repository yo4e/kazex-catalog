description:
  short: >
    A cosmic jazz album built around ghosts, velocity, afterimages, falling, signals,
    metal, and absence, tracing the idea of motion that continues after disappearance.
  long: >
    Even after a presence itself is gone, velocity, wake, afterimages, signals, and vectors
    keep moving. Across eleven tracks, Ghost Velocity explores the sensation of something
    untouchable continuing to fly with only the traces of motion left behind—from falling
    metal and scattered signals to a landing on invisible fire.

promotion:
  priority_pitch:
