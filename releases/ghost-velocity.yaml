description:
  short: >
    A cosmic jazz album built around ghosts, velocity, afterimages, falling, signals,
    metal, and absence, depicting motion that continues after disappearance.
  long: >
    Even after a presence itself is gone, velocity, wake, afterimages, signals, and vectors
    keep moving. Ghost Velocity centers on the sensation of untouchable things continuing to
    fly while leaving only traces of motion, unfolding across 11 tracks from falling metal and
    scattered signals to a landing on invisible fire.

promotion:
  priority_pitch:
    status: submitted
    selected_track: Ghost Velocity
    release_summary: >
      “Ghost Velocity” is a fast-paced cosmic jazz piece where vibraphone and piano trace luminous afterimages through space. Driven by upright bass and light drums, it moves with the force of something half-gone but still accelerating. Delicate chord accents suggest gravity, while the abstract arrangement turns speed, absence, and motion into a vivid sonic apparition.
    spotify_artist: "https://open.spotify.com/intl-ja/artist/26VmtM7je1d3PqWMW5ZXzc"
    marketing_elements:
