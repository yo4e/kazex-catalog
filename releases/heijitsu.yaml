notes_public: |
  2026-11-03に本人の指示で、ThaMall品川のファーストアルバム『平日』として制作中の情報を登録。
  約100曲の試作から15曲を厳選中。
  収録15件の曲名と並びは2026-11-03時点の仮案。個々の音源との対応や最終曲順は未確定。
  発売日、楽曲識別子、正式なジャケット、音源・クレジットは未登録。
  2026-11-04に本人が承認した英語セールスピッチと日本語訳の全文は docs/releases/heijitsu-sales-pitch.md に保存。
  英語原文は562文字のため、500文字上限のPriority Pitch用Release Summaryは申請準備時に別途整える。
