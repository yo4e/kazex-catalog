notes_public: |
  2026-11-03に本人の指示で、ThaMall品川のファーストアルバム『平日』として制作中の情報を登録。
  2026-11-03時点では約100曲の試作から15曲を厳選中で、収録15件の曲名と並びは仮案として保存していた。
  2026-11-06本人指定の制作アルバムと全15曲の公開ページを照合。既存の曲名・曲順が掲載内容と一致した。
  各曲の表示時間と共通Styles、作品説明、制作サービスを補完した。個々の音源対応の詳細は私的保管とする。
  creative_promptは公開Styles欄の表示を保持したもので、非公開の生成設定を確認したものではない。
  duration_secondsはSunoの表示時間。配信版音源の尺とToo Lostへの最終納品内容は未確認。
  全15曲のLyrics欄が[Instrumental]のためhas_lyricsをfalseとした。曲別instrumentalの本人確認は未登録。
  Suno上のReleased日付は配信日として使用しない。本人確認でToo Lostではリリース前のためplannedを維持。
  配信日、UPC/EAN、catalog number、各曲ISRC、配信URL、クレジットは未確定のまま保持する。
  Priority Pitchはdraft、代表曲・施策等は未選定のまま。制作元URLは公開カタログへ含めない。
  2026-11-04に本人が承認した英語セールスピッチと日本語訳の全文は docs/releases/heijitsu-sales-pitch.md に保存。
  英語原文は562文字のため、500文字上限のPriority Pitch用Release Summaryは申請準備時に別途整える。
  2026-11-08本人確認により、作品名・名義入りのジャケットを採用。Web掲載用コピーを登録。
