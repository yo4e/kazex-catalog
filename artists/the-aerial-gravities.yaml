notes_public: >
  2026-08-12にGitHub公開素材中心の参照設計へ移行。
  2026-08-18に正式アー写4点をルートInboxから分類登録。代表1枚は未指定。
  Spotify Artist URLと公開BIOを登録。公開BIOではThe Bookjam Paradoxが
  NovelJam 2025のofficial opening trackとして告知されていた。
  NovelJam公式サイトでは2025年の東京・札幌・沖縄3拠点開催は確認できたが、
  現時点で同曲のofficial opening track指定までは独立確認できていないため、
  verified milestoneには含めず出典付き注記として保持する。
  2026-10-25にMJQをモチーフとした4人の名前・担当楽器・性格・共通外観を
  制作会話から整理してmembersとvisual_identityへ登録。
  同日に集合アー写候補1点と関連リファレンス7点を元PNGのSHA-256照合後に登録。
  新規8点はcandidateとして保持し、代表アー写は未指定。
  2026-10-25に山田の指示で、それ以前の旧デザインのアー写4点を
  artist-photos/legacy/pre-2026-10-25/へ移動し、selectedからarchivedへ変更。
  旧版は履歴参照用であり、現行キャラクターデザインのアー写として再利用しない。
  同日制作の縦長プロモーション用生成アー写4点をChatGPT Libraryから元PNGのまま追加。
  現行リファレンスを参照して生成された候補として用途・寸法を登録し、代表アー写は未指定のまま維持。
  2026-10-26のGhost Velocity公開配信ページ調査で確認済みのApple Music Artist URLを登録。
  確認済みのLUストアURLを保持。YouTube公式artist URLは未確認のためnullを維持。
