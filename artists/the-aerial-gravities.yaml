  height_cm: 176
  build: 4人の身長と体格をほぼ同一に揃える
  clothing: 黒のスーツ、白シャツ、黒ネクタイ、黒革靴
  helmet: >
    白から淡い銀色のレトロなバイク用フルフェイス型。
    黒いスモークシールドで顔を完全に覆い、
    シェルと側面の円形ヒンジのディテールを揃える。
    透明な宇宙服ドームではない。
  face_visibility: concealed

