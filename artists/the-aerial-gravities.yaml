id: the-aerial-gravities
name: The Aerial Gravities
sort_name: The Aerial Gravities
status: active

description:
  short: >
    This music was not played. It was prompted, assembled, curated.
    The Aerial Gravities are imaginary. The fall is not.
  long: null

concept: >
  Modern Jazz Quartet (MJQ) の四重奏編成と4人の人物像を出発点に、
  メンバー名を空気・イオン・軌道・回転などのSF的な語彙と融合させた
  架空のジャズカルテット。MJQへのオマージュであり、実在の4人そのものではない。
  基本編成はヴィブラフォン、ピアノ、ウッドベース、ドラム。
  楽曲ごとの追加楽器や編曲はこの基本編成に限定しない。

# 2026-10-25の制作会話で決定した架空の4人のキャラクター設定。
members:
  - id: miltaer
    name: Miltaer
    name_ja: ミルテア
    part: vibraphone
    mjq_inspiration: Milt Jackson
    name_origin: Milt + aer (air)
    personality: >
      普段は寡黙で物静かだが、演奏時には大胆で情熱的になる即興家。
    role_in_group: >
      自由、感情、即興を担う。旋律に浮遊感と熱をもたらす。
  - id: jonion
    name: Jonion
    name_ja: ジョニオン
    part: piano
    mjq_inspiration: John Lewis
    name_origin: John + ion
    personality: >
      穏やかで理知的。構造と美学を重んじる完璧主義者で、ユーモアもある。
    role_in_group: >
      作曲、構成、アレンジをまとめる音楽監督。四重奏の秩序を設計する。
  - id: percigee
    name: Percigee
    name_ja: パーシジー
    part: upright bass
    mjq_inspiration: Percy Heath
    name_origin: Percy + perigee (近地点)
    personality: >
      陽気で豪快、現実的で頼りがいがある。航空や航法にも詳しい。
    role_in_group: >
      リズムと低音の基盤を担い、四重奏を地に足のついたものにする。
      物流や財務など実務面にも強い。
  - id: coniolis
    name: Coniolis
    name_ja: コニオリス
    part: drums
    mjq_inspiration: Connie Kay
    name_origin: Connie + Coriolis (コリオリ)
    personality: >
      控えめで飄々としており、観察力が鋭い。音色や機材の細部にこだわる職人肌。
    role_in_group: >
      時間、精密さ、微細なニュアンスを担う。ドラムセットの調整にも余念がない。

# 4人に共通するビジュアル設定。個別の画像ファイルは別途登録する。
