description:
  short: >
    実際のMRI検査で体験した機械音、金属音、静寂、臨床的な緊張感を音楽へ変換するプロジェクト。
  long: null

concept: >
  医療用MRIが「共鳴によって見えないものを可視化する」装置であることを、
  Music Resonance Imagingとして音楽へ置き換える。身体内部に潜む不可視の異変を
  Unseen Dragonというイメージで捉え、industrial techno、prepared piano、
  metallic percussion等によってMRI内部の聴覚体験を再構築する。

